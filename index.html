<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
    * {
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
  }
  
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #667eea, #764ba2);
  }

  .calculator {
    background: #1e1e1e;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    width: 320px;
  }

  #display {
    width: 100%;
    height: 70px;
    background: #2d2d2d;
    color: #fff;
    font-size: 2.5rem;
    text-align: right;
    padding: 10px;
    border: none;
    border-radius: 10px;
    margin-bottom: 20px;
    outline: none;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  button {
    height: 60px;
    font-size: 1.3rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
  }

  button:active {
    transform: scale(0.95);
  }

  /* Number buttons */
  .num {
    background: #3a3a3a;
    color: #fff;
  }
  .num:hover { background: #4a4a4a; }

  /* Operator buttons */
  .op {
    background: #ff9500;
    color: #fff;
    font-weight: bold;
  }
  .op:hover { background: #ffb143; }

  /* Special buttons */
  .clear {
    background: #ff3b30;
    color: #fff;
  }
  .clear:hover { background: #ff5e54; }

  .equal {
    background: #34c759;
    color: #fff;
    grid-column: span 2;
  }
  .equal:hover { background: #4cd964; }
</style>
</head>
<body>

<div class="calculator">
  <input type="text" id="display" readonly>
  
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="op" onclick="appendValue('/')">/</button>
    <button class="op" onclick="appendValue('*')">×</button>
    <button class="op" onclick="deleteLast()">⌫</button>

    <button class="num" onclick="appendValue('7')">7</button>
    <button class="num" onclick="appendValue('8')">8</button>
    <button class="num" onclick="appendValue('9')">9</button>
    <button class="op" onclick="appendValue('-')">-</button>

    <button class="num" onclick="appendValue('4')">4</button>
    <button class="num" onclick="appendValue('5')">5</button>
    <button class="num" onclick="appendValue('6')">6</button>
    <button class="op" onclick="appendValue('+')">+</button>

    <button class="num" onclick="appendValue('1')">1</button>
    <button class="num" onclick="appendValue('2')">2</button>
    <button class="num" onclick="appendValue('3')">3</button>
    <button class="num" onclick="appendValue('.')">.</button>

    <button class="num" onclick="appendValue('0')" style="grid-column: span 2;">0</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
  let display = document.getElementById('display');

  function appendValue(value) {
    display.value += value;
  }

  function clearDisplay() {
    display.value = '';
  }

  function deleteLast() {
    display.value = display.value.slice(0, -1);
  }

  function calculate() {
    try {
      // eval calculates the expression
      display.value = eval(display.value) || '';
    } catch (error) {
      display.value = 'Error';
      setTimeout(clearDisplay, 1000);
    }
  }

  // Keyboard support
  document.addEventListener('keydown', (e) => {
    if((e.key >= '0' && e.key <= '9') || ['+','-','*','/','.'].includes(e.key)) {
      appendValue(e.key);
    } else if(e.key === 'Enter') {
      calculate();
    } else if(e.key === 'Backspace') {
      deleteLast();
    } else if(e.key === 'Escape') {
      clearDisplay();
    }
  });
</script>

</body>
</html>
